[project]
name = "acompani"
version = "1.0.0"
description = "AcompanI — Autonomous Hierarchical Multi-Agent Organization Studio with Role-Scoped RAG, Casbin RBAC, and Cost-Aware Routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=0.3",
  "langchain-core>=0.3",
  "langchain-ollama>=0.2",
  "langchain-openai>=0.2",
  "langchain-text-splitters>=0.3",
  "chromadb>=0.6",
  "fastmcp>=2.0",
  "casbin>=1.36",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

